*{box-sizing:border-box;margin:0;padding:0}

.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:1.25rem}

.controls button:hover{background:var(--color-background-secondary)}
.controls button.active{background:var(--color-background-info);border-color:var(--color-border-info);color:var(--color-text-info)}
.stat{font-size:13px;color:var(--color-text-secondary);margin-left:auto}
.card-wrap{perspective:900px;cursor:pointer;width:100%;max-width:640px;margin:0 auto 1.25rem;aspect-ratio:2.2/1;min-height:200px}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);background:var(--color-background-primary);backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;text-align:center;gap:10px}
.face.back{transform:rotateY(180deg);background:var(--color-background-secondary)}
.face .tag{font-size:11px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;position:absolute;top:14px;left:16px}
.face .hint{font-size:11px;color:var(--color-text-tertiary);position:absolute;bottom:12px}
.zh{font-size:28px;font-weight:500;color:var(--color-text-primary);line-height:1.3}
.py{font-size:15px;color:var(--color-text-secondary);font-style:italic}
.ru{font-size:16px;color:var(--color-text-primary);line-height:1.55}
.nav{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:1.25rem;flex-wrap:wrap}
.nav button{padding:7px 20px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-size:14px;cursor:pointer}
.nav button:hover{background:var(--color-background-secondary)}
.nav button:disabled{opacity:.35;cursor:default}
.nav .pos{font-size:13px;color:var(--color-text-secondary);min-width:70px;text-align:center}
.progress{width:100%;max-width:640px;margin:0 auto 1rem;height:3px;background:var(--color-border-tertiary);border-radius:2px;overflow:hidden}
.progress-bar{height:100%;background:#378ADD;transition:width .3s}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem}
.cat-btn{padding:4px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:999px;font-size:12px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary)}
.cat-btn:hover{border-color:var(--color-border-secondary);color:var(--color-text-primary)}
.cat-btn.on{background:var(--color-background-info);border-color:var(--color-border-info);color:var(--color-text-info)}
.known-bar{display:flex;gap:4px;max-width:640px;margin:0 auto .75rem;font-size:12px;color:var(--color-text-secondary);align-items:center}
.known-count{margin-left:auto;color:var(--color-text-secondary)}
</style>

<div id="app">

<div class="controls">
  <button id="shuffleBtn" onclick="shuffle()">Перемешать</button>
  <button id="knownOnly" onclick="toggleKnownOnly()">Только незнакомые</button>
  <select id="catSel" onchange="filterCat()">

<div class="progress"><div class="progress-bar" id="prog"></div></div>

<div class="card-wrap" onclick="flip()">

</div>

<div class="nav">

  <span class="pos" id="pos"></span>
  <button onclick="next()">Вперёд →</button>
</div>

<div class="known-bar">

</div>

let deck = [], idx = 0, knownOnly = false, known = new Set(), curCat = "all";

function buildDeck(){
  deck = ALL.filter(c => curCat==="all" || c[3]===curCat);
  if(knownOnly) deck = deck.filter(c => !known.has(c[0]));
  idx = 0;
  render();
}

function render(){
  if(!deck.length){
    document.getElementById("fZh").textContent="—";
    document.getElementById("fPy").textContent="Нет карточек";
    document.getElementById("fRu").textContent="Измените фильтр";
    document.getElementById("catTag").textContent="";
    document.getElementById("pos").textContent="0 / 0";
    document.getElementById("prog").style.width="0%";
    document.getElementById("statLabel").textContent="0 карточек";
    return;
  }
  const c = deck[idx];
  document.getElementById("fZh").textContent=c[0];
  document.getElementById("fPy").textContent=c[1];
  document.getElementById("fRu").textContent=c[2];
  document.getElementById("catTag").textContent=catNames[c[3]]||"";
  document.getElementById("pos").textContent=(idx+1)+" / "+deck.length;
  document.getElementById("prog").style.width=Math.round((idx+1)/deck.length*100)+"%";
  document.getElementById("statLabel").textContent=deck.length+" карточек";
  document.getElementById("card").classList.remove("flipped");
  document.getElementById("knownN").textContent=known.size;
  document.getElementById("totalN").textContent=ALL.length;
  const isKnown = known.has(c[0]);
  document.querySelector(".card-wrap").style.opacity= isKnown ? "0.6" : "1";
}

function flip(){ document.getElementById("card").classList.toggle("flipped"); }
function next(){ if(idx<deck.length-1){idx++;render();} }
function prev(){ if(idx>0){idx--;render();} }
function shuffle(){ deck.sort(()=>Math.random()-.5); idx=0; render(); }
function filterCat(){ curCat=document.getElementById("catSel").value; buildDeck(); }
function markKnown(){ if(deck.length){known.add(deck[idx][0]); document.getElementById("knownN").textContent=known.size; next();} }
function markUnknown(){ if(deck.length){known.delete(deck[idx][0]); render();} }
function toggleKnownOnly(){ knownOnly=!knownOnly; document.getElementById("knownOnly").classList.toggle("active",knownOnly); buildDeck(); }

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowDown") next();
  if(e.key==="ArrowLeft"||e.key==="ArrowUp") prev();
  if(e.key===" "){e.preventDefault();flip();}
});

buildDeck();
</script>
